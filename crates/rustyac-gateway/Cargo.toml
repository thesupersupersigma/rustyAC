[package]
name = "rustyac-gateway"
description = "rustyAC WebSocket gateway: carries one Assetto Corsa client per WebSocket to an acServer's TCP and UDP port, so that a browser (or a desktop client behind an HTTP-only tunnel) can join; plain std, no dependencies"
# Written out, not inherited from the workspace: the gateway's Docker image is built from
# this folder alone (crates/rustyac-gateway/Dockerfile), where there is no workspace.
# docs/release.md: keep the version the same as the workspace's.
version = "0.38.8"
edition = "2021"
authors = ["thesupersupersigma"]
publish = false
license = "MIT OR Apache-2.0"

[lib]
name = "rustyac_gateway"
path = "src/lib.rs"

[[bin]]
name = "rustyac-gateway"
path = "src/main.rs"

# None, and it stays that way: plain std is what makes the binary small, quick to build on an
# old server and free of any code that needs a newer processor.
[dependencies]
