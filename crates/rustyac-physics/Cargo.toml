[package]
name = "rustyac-physics"
description = "rustyAC physics: swappable systems with a Vanilla (1:1 Assetto Corsa) implementation each"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true
# A 1:1 port of Assetto Corsa's car physics (acs.exe, Kunos Simulazioni); see LICENSING.md.
license = "GPL-3.0-or-later"

[dependencies]
rustyac-math = { path = "../rustyac-math" }
rustyac-ode = { path = "../rustyac-ode" }
# kn5 models: a track's physics meshes and helper nodes
rustyac-content = { path = "../rustyac-content" }
# feature `lua` (Task C6a-2b): INIpp's `$"..."` values on LuaJIT; x64 Windows CSP mode and tools only
rustyac-lua = { path = "../rustyac-lua", optional = true }
miniz_oxide = { version = "0.8", optional = true }

[features]
lua = ["dep:rustyac-lua", "rustyac-lua/luajit", "dep:miniz_oxide"]
