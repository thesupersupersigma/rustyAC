[package]
name = "rustyac-game"
description = "rustyAC, the game: a window with a debug view, the driver's devices, the physics thread and the shared memory around the Vanilla car"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true
# The crate's original files. A few files are ported from Assetto Corsa and carry no license, and
# two are shared with tools/chassis_compare under MIT OR Apache-2.0: see LICENSING.md.
license = "GPL-3.0-or-later"

[lib]
name = "rustyac_game"
path = "src/lib.rs"

[[bin]]
name = "rustyac"
path = "src/main.rs"

[dependencies]
rustyac-physics = { path = "../rustyac-physics" }
# AC's own powf / sinf (MSVCR120): the ported input shaping must give AC's numbers
rustyac-math = { path = "../rustyac-math" }
# kn5 models: the track and the car of the debug view
rustyac-content = { path = "../rustyac-content" }
rustyac-net = { path = "../rustyac-net" }
# AC's widget library, HUD objects and menus (portable; the window draws them with
# rustyac-render, the browser preview with its own painter)
rustyac-gui = { path = "../rustyac-gui" }
# Encodes the screenshot (`--screenshot`) as a PNG. Small and well known; nothing else uses it.
png = "0.17"

# Microsoft's own bindings to the Windows API. Everything that touches the machine goes through
# it: the window and its messages, Direct3D 11 (the API AC's renderer uses, which is the one to
# be ported later), XInput (the Xbox pad, read directly, so Steam Input is not needed),
# DirectInput 8 (wheels and other pads, force feedback), the keyboard, named shared memory, the
# high-resolution timer of the physics thread. No window or input crate is needed on top.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Console",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Media",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
    "Win32_UI_HiDpi",
    "Win32_Devices_HumanInterfaceDevice",
]

# Windows only, like the `windows` crate above: on another target (the browser build, the
# replay check under WASI) the crate is the simulation, the input classes and the scene maths.
[target.'cfg(windows)'.dependencies]
# AC's sound: its own FMOD banks through the player's own FMOD DLLs
rustyac-audio = { path = "../rustyac-audio" }
# AC's Python apps: the `ac` module on the player's own python33.dll
rustyac-python = { path = "../rustyac-python" }
# AC's renderer: its own shaders, materials, lighting, sky and shadows on Direct3D 11
rustyac-render = { path = "../rustyac-render" }
# `--join wss://...`: TLS to a gateway behind an HTTPS address (a Cloudflare Tunnel). rustls
# with the ring provider and Mozilla's root certificates compiled in; nothing of the
# system's TLS is used.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

# x64 Windows (the release's rustyac.exe): CSP mode's tyre rays on Embree 3.13.4 as CSP casts them
# (Task C5i-a; built by rustyac-ode's build.rs, which needs Visual Studio's C++ tools, CMake and
# Ninja). Elsewhere, the browser too: ODE's rays.
[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
rustyac-ode = { path = "../rustyac-ode", features = ["embree"] }

# Off Windows and the browser: AC's renderer only with the `wgpu` feature (native Full mode)
[target.'cfg(not(any(windows, all(target_arch = "wasm32", target_os = "unknown"))))'.dependencies]
rustyac-render = { path = "../rustyac-render", optional = true }

# The page's Full mode: AC's renderer on kgl's wgpu backend (WebGPU is turned on by rustyac-web,
# which gives kgl the page's device).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
rustyac-render = { path = "../rustyac-render", features = ["backend-wgpu"] }
rustyac-audio = { path = "../rustyac-audio" }
# the clock (std::time::SystemTime panics in a browser)
js-sys = "0.3"

[features]
# AC's renderer (`render::ac`) on kgl's wgpu backend on Windows too, as in the page: only for
# the native proofs of Full mode (rustyac-web's full_frame example). It leaves out the window,
# the debug view, the GUI, the sound and the command line, so rustyac.exe is the replay-only
# build with it.
wgpu = ["dep:rustyac-render", "rustyac-render/backend-wgpu"]
