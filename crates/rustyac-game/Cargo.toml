[package]
name = "rustyac-game"
description = "rustyAC, the game: a window with a debug view, the driver's devices, the physics thread and the shared memory around the Vanilla car"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true
# The crate's original files. A few files are ported from Assetto Corsa and carry no license, and
# two are shared with tools/chassis_compare under MIT OR Apache-2.0: see LICENSING.md.
license = "GPL-3.0-or-later"

[lib]
name = "rustyac_game"
path = "src/lib.rs"

[[bin]]
name = "rustyac"
path = "src/main.rs"

[dependencies]
rustyac-physics = { path = "../rustyac-physics" }
# AC's own powf / sinf (MSVCR120): the ported input shaping must give AC's numbers
rustyac-math = { path = "../rustyac-math" }
# kn5 models: the track and the car of the debug view
rustyac-content = { path = "../rustyac-content" }
# Encodes the screenshot (`--screenshot`) as a PNG. Small and well known; nothing else uses it.
png = "0.17"

# Microsoft's own bindings to the Windows API. Everything that touches the machine goes through
# it: the window and its messages, Direct3D 11 (the API AC's renderer uses, which is the one to
# be ported later), XInput (the Xbox pad, read directly, so Steam Input is not needed),
# DirectInput 8 (wheels and other pads, force feedback), the keyboard, named shared memory, the
# high-resolution timer of the physics thread. No window or input crate is needed on top.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Console",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Media",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
    "Win32_UI_HiDpi",
    "Win32_Devices_HumanInterfaceDevice",
]

# Windows only, like the `windows` crate above: on another target (the browser build, the
# replay check under WASI) the crate is the simulation, the input classes and the scene maths.
[target.'cfg(windows)'.dependencies]
# AC's sound: its own FMOD banks through the player's own FMOD DLLs
rustyac-audio = { path = "../rustyac-audio" }
# AC's renderer: its own shaders, materials, lighting, sky and shadows on Direct3D 11
rustyac-render = { path = "../rustyac-render" }
