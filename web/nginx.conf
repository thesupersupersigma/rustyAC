#
# nginx for rustyAC's browser preview (web/Dockerfile copies this file to
# /etc/nginx/conf.d/default.conf, so it is read inside nginx's `http` block).
#
# What is served: the static site in /usr/share/nginx/html, and, if a preview pack is
# mounted at /usr/share/nginx/html/preview, the pack under /preview/. TLS and the domain are
# the proxy's business (Coolify's Traefik, a Cloudflare Tunnel): this is plain HTTP on port 80.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # the proxy in front decides the public address: redirects stay relative
    absolute_redirect off;
    server_tokens off;

    # big files (a track model is hundreds of megabytes) go straight from the disk; byte
    # ranges are nginx's default for files and nothing here switches them off
    sendfile on;
    sendfile_max_chunk 2m;
    tcp_nopush on;

    # the site's text files and the wasm are sent compressed: from the .gz files the image
    # build made (gzip_static), or compressed on the way where there is none
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    # (text/html is always in the list)
    gzip_types text/css text/plain application/javascript text/javascript application/json application/wasm;

    # for Coolify's health check (and the image's own)
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    # the page itself is asked for again on every visit (a 304 when it has not changed)
    location = / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
    }

    # the wasm must arrive as application/wasm, or the browser will not compile it while it
    # streams. (nginx's own type list has it; said here so that it never depends on that.)
    # Like the page it is asked for again on every visit: the page's script, the glue and the
    # wasm of one build only work together, and a cache that kept one of them longer than
    # another would mix two builds after a deploy.
    location ~ ^/pkg/.*\.wasm$ {
        types { }
        default_type application/wasm;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }
    location ~ ^/(app\.js|pkg/.*\.js)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # the licence texts are shown, not downloaded
    location ~ ^/(LICENSING\.md|LICENSE-GPL)$ {
        types { }
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # the preview pack, if one is mounted: never compressed (a kn5 is hundreds of megabytes
    # and does not shrink much), its list of files never cached, the files for a short while
    location = /preview/manifest.json {
        gzip off;
        gzip_static off;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }
    location ^~ /preview/ {
        gzip off;
        gzip_static off;
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # everything else of the site: its file names are not hashed, so only a short cache
    location / {
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri $uri/ =404;
    }

    # no hidden files
    location ~ /\. {
        return 404;
    }
}
