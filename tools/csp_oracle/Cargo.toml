[package]
name = "csp_oracle"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"
description = "Spike oracle for Custom Shaders Patch: loads CSP's dwrite.dll next to an acs.exe image mapped by hand (never executed as a program), with the host's answers under control, and reports what CSP patched, started and asked for"

[dependencies]
# Task C4a: the air density port and the maths it calls, held against CSP's own in the process
rustyac-math = { path = "../../crates/rustyac-math" }
rustyac-physics = { path = "../../crates/rustyac-physics" }
# Task C5c: the f64 ODE functions held against CSP's
rustyac-ode = { path = "../../crates/rustyac-ode", features = ["embree"] }
# Task NH-5: CSP's hook on the remote-state add held against rustyac-net's csp_motion
rustyac-net = { path = "../../crates/rustyac-net" }

[profile.release]
opt-level = 3

# standalone crate, not part of the parent workspace
[workspace]
