[package]
name = "car_oracle"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"
description = "Test oracle: Assetto Corsa's own PhysicsEngine and one Car (loaded from acs.exe, never executed as a program) on a fake flat track, with every force and the full body / joint state recorded"

[dependencies]
# only for the tyre cross-check: the recorded tyre inputs are replayed through the Rust port
rustyac-physics = { path = "../../crates/rustyac-physics" }
rustyac-content = { path = "../../crates/rustyac-content" }
# Task 25: the port of the online client and the remote cars, held against the game's own
rustyac-net = { path = "../../crates/rustyac-net" }

[profile.release]
opt-level = 2

# standalone crate, not part of the parent workspace
[workspace]
