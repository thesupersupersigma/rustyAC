# The compiler every build and CI uses. Raise it only in its own task, with a full proof run:
# a new compiler can move bits (LLVM), lints and the wasm targets' libraries.
[toolchain]
channel = "1.97.0"
profile = "minimal"
components = ["clippy", "rustfmt"]
targets = ["wasm32-unknown-unknown", "wasm32-wasip1"]
