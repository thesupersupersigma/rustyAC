; SPDX-License-Identifier: MIT OR Apache-2.0
; rustyAC server kit: Kunos acServer settings for the Laguna Seca server.
; ADMIN_PASSWORD is not in git: the container's entrypoint fills it from AC_ADMIN_PASSWORD
; (an empty value leaves the admin commands switched off).
[SERVER]
NAME=rustyAC Laguna Seca
CARS=ks_ferrari_f2004;bmw_z4_gt3
CONFIG_TRACK=
TRACK=ks_laguna_seca
SUN_ANGLE=32
PASSWORD=
ADMIN_PASSWORD=@ADMIN_PASSWORD@
UDP_PORT=9610
TCP_PORT=9610
HTTP_PORT=8082
MAX_BALLAST_KG=0
QUALIFY_MAX_WAIT_PERC=120
RACE_PIT_WINDOW_START=0
RACE_PIT_WINDOW_END=0
REVERSED_GRID_RACE_POSITIONS=0
LOCKED_ENTRY_LIST=0
PICKUP_MODE_ENABLED=1
LOOP_MODE=1
SLEEP_TIME=1
CLIENT_SEND_INTERVAL_HZ=18
SEND_BUFFER_SIZE=0
RECV_BUFFER_SIZE=0
RACE_OVER_TIME=120
KICK_QUORUM=85
VOTING_QUORUM=80
VOTE_DURATION=20
BLACKLIST_MODE=1
FUEL_RATE=100
DAMAGE_MULTIPLIER=50
TYRE_WEAR_RATE=100
ALLOWED_TYRES_OUT=2
ABS_ALLOWED=1
TC_ALLOWED=1
START_RULE=1
RACE_GAS_PENALTY_DISABLED=0
TIME_OF_DAY_MULT=1
RESULT_SCREEN_TIME=30
MAX_CONTACTS_PER_KM=-1
STABILITY_ALLOWED=0
AUTOCLUTCH_ALLOWED=1
TYRE_BLANKETS_ALLOWED=1
FORCE_VIRTUAL_MIRROR=0
REGISTER_TO_LOBBY=0
MAX_CLIENTS=12
NUM_THREADS=2
UDP_PLUGIN_LOCAL_PORT=0
UDP_PLUGIN_ADDRESS=
AUTH_PLUGIN_ADDRESS=
LEGAL_TYRES=
RACE_EXTRA_LAP=0
WELCOME_MESSAGE=

[PRACTICE]
NAME=Practice
TIME=20
IS_OPEN=1

[QUALIFY]
NAME=Qualify
TIME=10
IS_OPEN=1

[RACE]
NAME=Race
LAPS=5
WAIT_TIME=60
IS_OPEN=1

[DYNAMIC_TRACK]
SESSION_START=96
RANDOMNESS=1
SESSION_TRANSFER=80
LAP_GAIN=30

[WEATHER_0]
GRAPHICS=3_clear
BASE_TEMPERATURE_AMBIENT=26
BASE_TEMPERATURE_ROAD=8
VARIATION_AMBIENT=1
VARIATION_ROAD=1
WIND_BASE_SPEED_MIN=0
WIND_BASE_SPEED_MAX=8
WIND_BASE_DIRECTION=30
WIND_VARIATION_DIRECTION=15
