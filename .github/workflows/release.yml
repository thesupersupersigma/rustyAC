# SPDX-License-Identifier: MIT OR Apache-2.0

# A pushed tag vX.Y.Z becomes a release: built and tested from scratch on GitHub's own Windows
# machine, zipped, and published in the repo's Releases section, with the browser preview's site
# as a second zip. See docs/release.md.
# It can also be started by hand for a tag that exists already (Actions -> Release -> Run workflow).
# No Assetto Corsa file is here, is fetched or goes into the zip.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to release, e.g. v0.15.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # the same version as in ci.yml
  RUST_TOOLCHAIN: "1.97.0"
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: build and publish
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # started by hand, the tag is somebody's typing: it must look like a version before it is used
      - name: Check the tag's form
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$TAG' is not a tag of the form vX.Y.Z"
            exit 1
          fi

      # the tag itself is checked out (a run started by hand would otherwise build the branch);
      # a tag that does not exist stops the run here
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Check the tag against Cargo.toml
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version *= *"\([^"]*\)".*/\1/p}' Cargo.toml | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::no [workspace.package] version found in Cargo.toml"
            exit 1
          fi
          if [ "$TAG" != "v$version" ]; then
            echo "::error::the tag is $TAG but Cargo.toml says version $version: the tag must be v$version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # an existing release is never deleted or overwritten
      - name: Check that the release does not exist yet
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::the release $TAG already exists; it is not overwritten. Delete it by hand on GitHub if it really must be made again, or release a new version."
            exit 1
          fi

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown
          rustc --version
          cargo --version

      # MSVCR120.dll: the maths of the game itself, which the tests compare against
      - name: Install the Visual C++ 2013 runtime
        run: |
          choco install vcredist2013 -y --no-progress
          if [ ! -f "$SYSTEMROOT/System32/msvcr120.dll" ]; then
            echo "::error::MSVCR120.dll is not in System32 after installing vcredist2013: the tests would run on Rust's own maths"
            exit 1
          fi

      - name: Build
        run: cargo build --release --workspace --locked

      - name: Test
        run: cargo test --release --workspace --locked

      - name: Package
        shell: pwsh
        run: ./packaging/package.ps1 -Version $env:VERSION -OutDir dist

      # the site only (the page, its script, the wasm): build.py reads the zip back and stops if
      # anything else is in it. No preview pack, no Assetto Corsa file.
      - name: Package the browser preview
        run: python web/build.py --zip "dist/rustyAC-$TAG-web.zip"

      - name: Publish the release
        run: |
          zip="dist/rustyAC-$TAG-windows-x64.zip"
          web="dist/rustyAC-$TAG-web.zip"
          gh release create "$TAG" "$zip" "$zip.sha256" "$web" "$web.sha256" \
            --verify-tag \
            --title "rustyAC $TAG" \
            --generate-notes \
            --latest